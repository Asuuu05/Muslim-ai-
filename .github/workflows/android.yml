name: Build Muslim AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MuslimAI_AndroidStudio.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip MuslimAI_AndroidStudio.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/MuslimAI_AndroidStudio assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MuslimAI-debug-apk
          path: extracted/MuslimAI_AndroidStudio/app/build/outputs/apk/debug/*.apk
