name: Build Muslim AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MuslimAI_AndroidStudio.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip MuslimAI_AndroidStudio.zip -d extracted
                - name: Fix Java and Kotlin version mismatch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/MuslimAI_AndroidStudio/app/build.gradle.kts")
          s = p.read_text()

          marker = "    compileSdk = 35\n"
          fix = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions {
              jvmTarget = "17"
          }
          """

          if "compileOptions" not in s:
              s = s.replace(marker, marker + fix, 1)

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          gradle -p extracted/MuslimAI_AndroidStudio assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MuslimAI-debug-apk
          path: extracted/MuslimAI_AndroidStudio/app/build/outputs/apk/debug/*.apk
